name: Refresh data (CBU rates + MET Norway weather)

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/refresh.py || true   # on fetch errors the previous files stay (no invented data)
      - id: commit
        run: |
          if git diff --quiet site/data; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "kabar-unnie"
          git config user.email "360024474+kabarunnie@users.noreply.github.com"
          git add site/data && git commit -m "data: refresh" && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
